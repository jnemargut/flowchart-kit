name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # vendor/sketch must be an untouched copy of Storyboard Kit's src/sketch
      - run: npm run check-sketch
      - run: npm run typecheck
      - run: npm test
